<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FBF5C" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="radial-glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8FBF5C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8FBF5C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radial-blue" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#radial-glow)"/>
  <rect width="1200" height="630" fill="url(#radial-blue)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <rect width="96" height="96" rx="26" fill="url(#accent)"/>
    <!-- Phone + Bolt Icon -->
    <rect x="26" y="16" width="44" height="64" rx="9" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M52 28 L40 48 H50 L44 66 L60 46 H48 L52 28Z" fill="#FFFFFF"/>
  </g>

  <!-- Brand Text -->
  <text x="216" y="152" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">FixFlow</text>
  <text x="216" y="186" fill="#8FBF5C" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="1.5">MOBILE SERVICE MANAGEMENT</text>

  <!-- Hero Headline -->
  <text x="100" y="295" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Complete Mobile Phone Repair</text>
  <text x="100" y="355" fill="url(#accent)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">&amp; Service Center Operations</text>

  <!-- Description -->
  <text x="100" y="420" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Intake job cards, real-time technician workflows, stock inventory &amp; billing.</text>

  <!-- Badges / Feature Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#8FBF5C"/>
    <text x="42" y="30" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Digital Job Cards</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="230" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="264" cy="24" r="6" fill="#38BDF8"/>
    <text x="282" y="30" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Technician Bench</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="220" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="514" cy="24" r="6" fill="#A855F7"/>
    <text x="532" y="30" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Parts Inventory</text>

    <!-- Pill 4 -->
    <rect x="730" y="0" width="230" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="754" cy="24" r="6" fill="#F59E0B"/>
    <text x="772" y="30" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Instant GST Invoicing</text>
  </g>

  <!-- Right Side Graphic / Preview Device Mockup -->
  <g transform="translate(860, 110)">
    <rect width="240" height="340" rx="36" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <rect x="16" y="24" width="208" height="292" rx="22" fill="#1E293B"/>
    <!-- Screen Header -->
    <rect x="28" y="38" width="80" height="12" rx="6" fill="#8FBF5C"/>
    <rect x="28" y="58" width="140" height="8" rx="4" fill="#64748B"/>
    <!-- Job Item card 1 -->
    <rect x="28" y="82" width="184" height="60" rx="10" fill="#334155" fill-opacity="0.6"/>
    <circle cx="46" cy="112" r="10" fill="#8FBF5C"/>
    <rect x="66" y="98" width="70" height="10" rx="4" fill="#F8FAFC"/>
    <rect x="66" y="114" width="110" height="8" rx="4" fill="#94A3B8"/>
    <!-- Job Item card 2 -->
    <rect x="28" y="152" width="184" height="60" rx="10" fill="#334155" fill-opacity="0.6"/>
    <circle cx="46" cy="182" r="10" fill="#38BDF8"/>
    <rect x="66" y="168" width="85" height="10" rx="4" fill="#F8FAFC"/>
    <rect x="66" y="184" width="95" height="8" rx="4" fill="#94A3B8"/>
    <!-- Status badge -->
    <rect x="28" y="224" width="184" height="74" rx="10" fill="#8FBF5C" fill-opacity="0.15" stroke="#8FBF5C" stroke-width="1"/>
    <text x="44" y="252" fill="#8FBF5C" font-family="system-ui, sans-serif" font-size="13" font-weight="700">₹35,500 Collected</text>
    <text x="44" y="274" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">12 Repairs Completed</text>
  </g>
</svg>
